<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
  const GLYPHS = 'ｦｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+-<>|'
  const SIZE = 16
  const canvas = document.querySelector('canvas')
  const ctx = canvas.getContext('2d')
  const slow = matchMedia('(prefers-reduced-motion: reduce)').matches
  const glyph = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
  let drops = []

  const resize = () => {
    canvas.width = innerWidth * devicePixelRatio
    canvas.height = innerHeight * devicePixelRatio
    ctx.scale(devicePixelRatio, devicePixelRatio)
    ctx.font = `${SIZE}px monospace`
    ctx.textBaseline = 'top'
    drops = Array.from({ length: Math.ceil(innerWidth / SIZE) }, () => -Math.floor(Math.random() * innerHeight / SIZE))
  }

  const tick = () => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.07)'
    ctx.fillRect(0, 0, innerWidth, innerHeight)
    drops.forEach((row, column) => {
      const x = column * SIZE
      if (row > 0) {
        ctx.fillStyle = '#000000'
        ctx.fillRect(x, (row - 1) * SIZE, SIZE, SIZE)
        ctx.fillStyle = '#00ff41'
        ctx.fillText(glyph(), x, (row - 1) * SIZE)
      }
      ctx.fillStyle = '#e8ffee'
      ctx.fillText(glyph(), x, row * SIZE)
      drops[column] = row * SIZE > innerHeight && Math.random() > 0.975 ? 0 : row + 1
    })
  }

  addEventListener('resize', resize)
  resize()
  setInterval(tick, slow ? 400 : 55)
</script>
</body>
</html>
